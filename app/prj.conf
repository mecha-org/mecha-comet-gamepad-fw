CONFIG_LOG=y

# Buttons and sticks arrive as input events.
CONFIG_INPUT=y

# The USB serial number comes from the unique ID of the chip.
CONFIG_HWINFO=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
